name: FLiNG Trainer Auto-Scraper Pipeline

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Pinpoint scrape a single target FLiNG trainer URL'
        required: false
        default: ''
      retry_only:
        description: '수집·무결성 복구 없이 번역 재시도만 한 배치 실행'
        type: boolean
        required: false
        default: false
      recover_internal_quota_trainer:
        description: '입증된 과거 내부 한도 복구: 2730 또는 2731 한 게임만(선택)'
        type: choice
        options: ['', '2730', '2731']
        default: ''
      audit_approved_trainer:
        description: '읽기 전용 원본 감사: 운영 DB·번역·재검증 없이 한 게임만 확인'
        type: choice
        options: ['', '2730', '2731']
        required: false
        default: ''

# 예약 실행과 관리자가 누른 수동 실행은 같은 DB·외부 번역 quota를 사용한다.
# 실행 중인 작업을 취소하면 초안/재시도 상태가 반쯤 남을 수 있으므로 새 실행은 대기한다.
concurrency:
  group: fling-trainer-scraper-production
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate bounded manual recovery inputs before side effects
        env:
          RETRY_ONLY: ${{ github.event.inputs.retry_only }}
          RECOVERY_TRAINER: ${{ github.event.inputs.recover_internal_quota_trainer }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
          AUDIT_TRAINER: ${{ github.event.inputs.audit_approved_trainer }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          # 진단 브랜치에서 감사 입력이 누락되어도 운영 작업으로 전환하지 않는다.
          if [ "$WORKFLOW_REF" != "refs/heads/main" ] && [ -z "$AUDIT_TRAINER" ]; then
            echo '[NON_MAIN_REQUIRES_READ_ONLY_AUDIT]'
            exit 1
          fi
          if [ -n "$AUDIT_TRAINER" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              echo '[AUDIT_REQUIRES_MANUAL_EVENT]'
              exit 1
            fi
            case "$AUDIT_TRAINER" in
              2730|2731) ;;
              *) echo '[AUDIT_TRAINER_NOT_ALLOWED]'; exit 1 ;;
            esac
            if [ -n "$TARGET_URL" ] || [ "$RETRY_ONLY" = "true" ] || [ -n "$RECOVERY_TRAINER" ]; then
              echo '[AUDIT_INPUT_CONFLICT]'
              exit 1
            fi
          fi
          if [ "$RETRY_ONLY" = "true" ] && [ -n "$TARGET_URL" ]; then
            echo '[RETRY_ONLY_TARGET_URL_CONFLICT]'
            exit 1
          fi
          if [ -n "$RECOVERY_TRAINER" ]; then
            if [ "$RETRY_ONLY" != "true" ]; then
              echo '[RECOVERY_REQUIRES_RETRY_ONLY]'
              exit 1
            fi
            case "$RECOVERY_TRAINER" in
              2730|2731) ;;
              *) echo '[RECOVERY_TRAINER_NOT_ALLOWED]'; exit 1 ;;
            esac
          fi

  drain-patcher-revalidation-outbox:
    needs: validate-inputs
    # 단일 URL 복구는 다른 대상의 재검증 큐를 소진하지 않는다.
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.audit_approved_trainer == '' && github.event.inputs.retry_only != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_url == '')) }}
    # 수집 결과와 독립적으로 실행한다. 수집 실패가 ready/deferred 항목의 재시도를 막으면 안 된다.
    runs-on: ubuntu-latest
    steps:
      - name: Drain durable patcher revalidation outbox
        env:
          PATCHER_REVALIDATE_OUTBOX_URL: https://localpatcher.com/api/internal/drain-patcher-revalidation-outbox
          PATCHER_REVALIDATE_SECRET: ${{ secrets.PATCHER_REVALIDATE_SECRET }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${PATCHER_REVALIDATE_SECRET}" \
            "${PATCHER_REVALIDATE_OUTBOX_URL}"

  crawl:
    needs: validate-inputs
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.audit_approved_trainer == '' && github.event.inputs.retry_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install scraper dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pefile supabase python-dotenv

    - name: Run Crawler & Auto-Translation Pipeline
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
        AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        AZURE_TRANSLATOR_ENDPOINT: ${{ secrets.AZURE_TRANSLATOR_ENDPOINT }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: gemini-2.5-flash
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PATCHER_REVALIDATE_URL: https://localpatcher.com/api/internal/revalidate-patcher
        PATCHER_REVALIDATE_SECRET: ${{ secrets.PATCHER_REVALIDATE_SECRET }}
      run: |
        if [ -n "${{ github.event.inputs.target_url }}" ]; then
          python scripts/scraper.py --provider gemini --url "${{ github.event.inputs.target_url }}"
        else
          # 공식 사이트맵에서 발견한 신규 URL은 한 실행에 세 건만 실제 처리한다.
          # 발견 자체는 모두 기록하되, FLiNG 요청량·번역 quota 폭증을 막는다.
          python scripts/scraper.py --provider gemini --discovery-limit 3
        fi

  reprocess-ready:
    needs: [validate-inputs, crawl]
    # 예약 수집과 관리 화면의 일반 동기화는 DB가 claim한 due/ready 항목을 작은
    # 배치로 처리한다. 수동 단일 URL 수집에는 섞지 않는다.
    # 새 수집 일부가 실패해도 기존 due retry가 영구 정지하면 안 된다.
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.event.inputs.audit_approved_trainer == '' && needs.validate-inputs.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_url == '')) }}
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install scraper dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pefile supabase python-dotenv

    - name: Reprocess due translation retries
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: gemini-2.5-flash
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PATCHER_REVALIDATE_URL: https://localpatcher.com/api/internal/revalidate-patcher
        PATCHER_REVALIDATE_SECRET: ${{ secrets.PATCHER_REVALIDATE_SECRET }}
        RETRY_ONLY: ${{ github.event.inputs.retry_only }}
        RECOVERY_TRAINER: ${{ github.event.inputs.recover_internal_quota_trainer }}
      run: |
        if [ -n "$RECOVERY_TRAINER" ]; then
          if [ "$RETRY_ONLY" != "true" ]; then
            echo '[RECOVERY_REQUIRES_RETRY_ONLY]'
            exit 1
          fi
          case "$RECOVERY_TRAINER" in
            2730|2731) ;;
            *) echo '[RECOVERY_TRAINER_NOT_ALLOWED]'; exit 1 ;;
          esac
          python scripts/reprocess_pending_translations.py --apply --provider gemini --limit 4 --recover-internal-quota-trainer "$RECOVERY_TRAINER"
        else
          python scripts/reprocess_pending_translations.py --apply --provider gemini --limit 4
        fi

  integrity-recovery:
    needs: [crawl, reprocess-ready]
    # 크롤링과 일반 재번역이 모두 성공한 뒤에만 실행한다. 승인본은 복구 대상이 아니며,
    # 한 번에 하나만 동일 바이너리 신원 검증 후 누락 언어 슬롯을 보완한다.
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.event.inputs.audit_approved_trainer == '' && github.event.inputs.retry_only != 'true' && needs.crawl.result == 'success' && needs.reprocess-ready.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_url == '')) }}
    concurrency:
      group: translation-integrity-recovery-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install scraper dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pefile supabase python-dotenv
    - name: Recover one verified missing translation slot
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: gemini-2.5-flash
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PATCHER_REVALIDATE_URL: https://localpatcher.com/api/internal/revalidate-patcher
        PATCHER_REVALIDATE_SECRET: ${{ secrets.PATCHER_REVALIDATE_SECRET }}
      run: python scripts/recover_translation_integrity.py --apply --provider gemini --limit 1

  audit-approved-source:
    needs: validate-inputs
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate-inputs.result == 'success' && (github.event.inputs.audit_approved_trainer == '2730' || github.event.inputs.audit_approved_trainer == '2731') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out read-only audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject local credential files
        run: |
          if [ -e .env.local ]; then
            echo '[AUDIT_LOCAL_ENV_NOT_ALLOWED]'
            exit 1
          fi
      - name: Set up Python audit environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install existing scraper dependencies
        run: pip install requests beautifulsoup4 pefile supabase python-dotenv
      - name: Audit one approved trainer without operational credentials
        id: audit-source
        env:
          AUDIT_TRAINER: ${{ github.event.inputs.audit_approved_trainer }}
        run: |
          set -C
          exec 3> "$RUNNER_TEMP/approved-source-audit.json"
          echo 'report_created=true' >> "$GITHUB_OUTPUT"
          python scripts/audit_approved_translation_repair.py \
            --trainer-id "$AUDIT_TRAINER" >&3
      # 실패 결과도 비식별 JSON 한 개만 보존하며 원본 바이너리는 업로드하지 않는다.
      - name: Preserve sanitized source audit report only
        if: ${{ always() && !cancelled() && steps.audit-source.outputs.report_created == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-source-audit
          path: ${{ runner.temp }}/approved-source-audit.json
          if-no-files-found: ignore
          retention-days: 1
