name: FLiNG Trainer Auto-Scraper Pipeline

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Pinpoint scrape a single target FLiNG trainer URL'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install scraper dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pefile supabase python-dotenv

    - name: Run Crawler & Auto-Translation Pipeline
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
        AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        AZURE_TRANSLATOR_ENDPOINT: ${{ secrets.AZURE_TRANSLATOR_ENDPOINT }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: gemini-2.5-flash
        GEMINI_MONTHLY_MAX_CHARS: ${{ vars.GEMINI_MONTHLY_MAX_CHARS }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_FALLBACK_MONTHLY_MAX_CHARS: ${{ vars.OPENAI_FALLBACK_MONTHLY_MAX_CHARS }}
        OPENAI_FALLBACK_MAX_REQUESTS: ${{ vars.OPENAI_FALLBACK_MAX_REQUESTS || '8' }}
        OPENAI_FALLBACK_MAX_CHARS: ${{ vars.OPENAI_FALLBACK_MAX_CHARS || '12000' }}
      run: |
        if [ -n "${{ github.event.inputs.target_url }}" ]; then
          python scripts/scraper.py --provider gemini --url "${{ github.event.inputs.target_url }}"
        else
          python scripts/scraper.py --provider gemini
        fi

  reprocess-ready:
    needs: crawl
    # 수동 단일 수집에는 섞지 않는다. 예약 수집이 성공한 경우에만 DB가 claim한
    # due/ready 항목을 작은 배치로 처리한다.
    # 새 수집 일부가 실패해도 기존 due retry가 영구 정지하면 안 된다.
    if: ${{ always() && !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install scraper dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pefile supabase python-dotenv

    - name: Reprocess due translation retries
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: gemini-2.5-flash
        GEMINI_MONTHLY_MAX_CHARS: ${{ vars.GEMINI_MONTHLY_MAX_CHARS }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_FALLBACK_MONTHLY_MAX_CHARS: ${{ vars.OPENAI_FALLBACK_MONTHLY_MAX_CHARS }}
        OPENAI_FALLBACK_MAX_REQUESTS: ${{ vars.OPENAI_FALLBACK_MAX_REQUESTS || '8' }}
        OPENAI_FALLBACK_MAX_CHARS: ${{ vars.OPENAI_FALLBACK_MAX_CHARS || '12000' }}
      run: python scripts/reprocess_pending_translations.py --apply --provider gemini --limit 4
